# Cấu hình mpv cho Radio VN
fullscreen=yes
idle=yes
force-window=yes
keep-open=no

# Chỉ phát tiếng, không hiện hình
vid=no
audio-display=no

# Giao diện do radiovn.py vẽ qua socket IPC
osd-bar=no
osd-level=1
input-default-bindings=no

# Âm thanh
volume=80
volume-max=100

# Mạng
cache=yes
cache-secs=10
demuxer-max-bytes=8MiB
network-timeout=10
# Mở luồng nhanh hơn (đọc ít dữ liệu hơn trước khi phát)
demuxer-lavf-analyzeduration=1.5
demuxer-lavf-probesize=65536
user-agent="Mozilla/5.0 (Linux; Android 12) RadioVN/1.0"

# Font tiếng Việt (mpv tự nạp font trong thư mục mpv/fonts)
osd-font="Be Vietnam Pro"
osd-font-size=28
