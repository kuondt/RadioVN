# Phím dự phòng, chỉ dùng khi script radiovn.lua không chạy được.
# Khi script chạy, nó sẽ ghi đè các phím này.
UP     playlist-prev ; show-text "${playlist}" 4000
DOWN   playlist-next ; show-text "${playlist}" 4000
PGUP   playlist-prev ; show-text "${playlist}" 4000
PGDWN  playlist-next ; show-text "${playlist}" 4000
LEFT   add volume -5 ; show-text "Âm lượng ${volume}%"
RIGHT  add volume 5 ; show-text "Âm lượng ${volume}%"
ENTER  show-text "${playlist}" 4000
BS     show-text "${playlist}" 4000
SPACE  cycle pause
h      show-text "${playlist}" 4000
q      quit
ESC    quit
